<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-color: white;
            background-color: rgb(77, 17, 17);
        }
        header{
            text-align: center;
        }
        section{
            background-color: #fff;
            padding: 100px;
            border-radius: 20px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgb(111, 12, 12);
        }
        input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #910a0a;
            border-radius: 5px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 200px;
            padding: 0px;
        }

    .title-box {
      background-color: #e6e4e4;
      color: #fafafa;
      width: 100%;
      max-width: 550px;
      text-align: center;
      padding: 8px 0;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    </style>
        
</head>
<body> 
    <header>
    <h1>Rate a Movie</h1>
    <br>

    <section>
        <form action="">
        <input type="text" placeholder="Movie Title">
            <img src="https://www.nicepng.com/png/detail/107-1070734_png-to-movie-lets-go-to-the-movies.png" alt="logo"
            
            

            <label for="" >Genre/s</label>
            <br>
            <input type="checkbox" id="Action" name="genre" value="Action">
                    <label for="action">Action</label>
            <input type="checkbox" id="comedy" name="genre" value="Comedy">
                    <label for="comedy">Comedy</label>
            <input type="checkbox" id="drama" name="genre" value="Drama">
                    <label for="drama">Drama</label>
            <input type="checkbox" id="fantasy" name="genre" value="Fantasy">
                    <label for="fantasy">Fantasy</label>
            <input type="checkbox" id="scifi" name="genre" value="Sci-Fi">
                    <label for="scifi">Sci-Fi</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1">⭐</label>
            <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">⭐⭐</label>
            <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">⭐⭐⭐</label>
            <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">⭐⭐⭐⭐</label>
            <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5">⭐⭐⭐⭐⭐</label>
            </div>

            <br>
            <textarea id="review" placeholder="Write a review here..." rows="4" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" value="Submit Review"
            font-family: Arial, Helvetica, sans-serif;

            
        
            
        </section>
    </body>
</html>
